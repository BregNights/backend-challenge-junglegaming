name: wagering

x-app-image: &app-image
  build: .
  image: wagering-processor:local

x-app-env: &app-env
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://ministack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  LOG_LEVEL: info
  # Ajustáveis sem editar o arquivo (usados nos experimentos de docs/LOAD_TEST.md).
  SQS_CONSUMER_CONCURRENCY: ${SQS_CONSUMER_CONCURRENCY:-2}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # cria o banco wagering_test usado pelos testes de integração
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Emulador AWS gratuito compatível com a LocalStack; só o SQS é usado.
  ministack:
    image: ministackorg/ministack:1.5.29
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: aplica as migrations e provisiona as filas antes de qualquer instância subir,
  # para que N réplicas nunca disputem mudanças de schema.
  bootstrap:
    <<: *app-image
    command: ["sh", "-c", "bun run migration:up && bun run queues:provision"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    environment:
      <<: *app-env
      PORT: "3000"
    # Três instâncias idênticas por padrão: a correção não pode depender de rodar só uma.
    deploy:
      replicas: 3
    ports:
      - "3000-3002:3000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

volumes:
  postgres-data:
